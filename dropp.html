<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop - نقل الملفات المباشر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
    body { font-family: 'Tajawal', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 py-4 px-6 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">.</div>
      <span class="text-2xl font-black text-slate-900 tracking-tight">drop<span class="text-blue-600">.</span></span>
    </div>
    <div class="flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>اتصال P2P مباشر</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto w-full p-4 my-auto">
    
    <div id="step-connect" class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 text-center space-y-6">
      <div class="space-y-2">
        <h2 class="text-xl font-bold text-slate-900">ربط الجهازين مباشرة</h2>
        <p class="text-sm text-slate-500">امسح الرمز بالكاميرا للاتصال الفوري</p>
      </div>

      <div class="flex justify-center my-4">
        <div id="qrcode" class="p-4 bg-white rounded-2xl shadow-md border border-slate-200 min-w-[180px] min-h-[180px] flex items-center justify-center"></div>
      </div>

      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-2 text-right">
        <div class="truncate text-xs text-slate-600 font-mono" id="peer-id-text">جاري التحميل...</div>
        <button onclick="copyRoomLink()" class="bg-white hover:bg-slate-100 text-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1 shrink-0">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> نسخ
        </button>
      </div>
    </div>

    <div id="step-transfer" class="hidden bg-white rounded-3xl p-6 shadow-xl border border-slate-100 space-y-6">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></div>
          <div>
            <h3 class="font-bold text-slate-900">تم الاتصال بنجاح</h3>
            <p class="text-xs text-slate-500">جاهز لنقل الملفات</p>
          </div>
        </div>
        <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">مشفر</span>
      </div>

      <div id="drop-zone" onclick="document.getElementById('file-input').click()" 
           class="border-2 border-dashed border-blue-200 hover:border-blue-500 bg-blue-50/50 hover:bg-blue-50 transition-all rounded-2xl p-8 text-center cursor-pointer group">
        <input type="file" id="file-input" class="hidden" onchange="handleFileSelected(event)">
        <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
          <i data-lucide="upload-cloud" class="w-7 h-7"></i>
        </div>
        <p class="font-bold text-slate-800 mb-1">اختر ملفاً أو اسحبه هنا</p>
      </div>

      <div id="file-list" class="space-y-3"></div>
    </div>

  </main>

  <footer class="text-center py-4 text-xs text-slate-400">
    تطبيق نقل الملفات المباشر &copy; 2026
  </footer>

  <script>
    lucide.createIcons();

    let peer = null;
    let connection = null;

    function initializePeer() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetRoomId = urlParams.get('room');

      peer = new Peer();

      peer.on('open', (id) => {
        if (targetRoomId) {
          document.getElementById('peer-id-text').innerText = "جاري الاتصال...";
          connectToDevice(targetRoomId);
        } else {
          const roomUrl = `${window.location.origin}${window.location.pathname}?room=${id}`;
          document.getElementById('peer-id-text').innerText = roomUrl;
          
          new QRCode(document.getElementById("qrcode"), {
            text: roomUrl,
            width: 160,
            height: 160
          });
        }
      });

      peer.on('connection', (conn) => {
        connection = conn;
        setupConnectionEvents();
      });

      peer.on('error', () => {
        alert("حدث خطأ في الاتصال.");
      });
    }

    function connectToDevice(targetId) {
      connection = peer.connect(targetId);
      setupConnectionEvents();
    }

    function setupConnectionEvents() {
      connection.on('open', () => {
        document.getElementById('step-connect').classList.add('hidden');
        document.getElementById('step-transfer').classList.remove('hidden');
      });

      connection.on('data', (data) => {
        if (data.type === 'file') {
          handleIncomingFile(data);
        }
      });

      connection.on('close', () => {
        alert("انقطع الاتصال.");
        location.href = window.location.pathname;
      });
    }

    function handleFileSelected(event) {
      const file = event.target.files[0];
      if (!file || !connection) return;

      const reader = new FileReader();
      const fileCardId = 'file-' + Date.now();
      
      renderFileCard(fileCardId, file.name, formatFileSize(file.size), 'out');

      reader.onload = (e) => {
        connection.send({
          type: 'file',
          name: file.name,
          mime: file.type,
          size: file.size,
          buffer: e.target.result
        });

        updateFileProgress(fileCardId, 100, true);
      };

      reader.readAsArrayBuffer(file);
    }

    function handleIncomingFile(data) {
      const fileCardId = 'file-' + Date.now();
      renderFileCard(fileCardId, data.name, formatFileSize(data.size), 'in');
      
      const fileBlob = new Blob([data.buffer], { type: data.mime || 'application/octet-stream' });
      const fileDownloadUrl = URL.createObjectURL(fileBlob);

      updateFileProgress(fileCardId, 100, false, fileDownloadUrl, data.name);
    }

    function renderFileCard(id, fileName, fileSize, direction) {
      const listContainer = document.getElementById('file-list');
      const isOutgoing = direction === 'out';
      
      const cardHTML = `
        <div id="${id}" class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 truncate max-w-[70%]">
              <i data-lucide="${isOutgoing ? 'arrow-up-right' : 'arrow-down-left'}" class="${isOutgoing ? 'text-blue-600' : 'text-emerald-600'} w-4 h-4 shrink-0"></i>
              <span class="file-name font-medium text-slate-800 truncate"></span>
            </div>
            <span class="text-slate-400 shrink-0">${fileSize}</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
            <div class="progress-bar bg-blue-600 h-1.5 rounded-full w-0 transition-all duration-300"></div>
          </div>
          <div class="action-area flex justify-end"></div>
        </div>
      `;
      listContainer.insertAdjacentHTML('afterbegin', cardHTML);
      
      const cardElement = document.getElementById(id);
      cardElement.querySelector('.file-name').textContent = fileName;
      
      lucide.createIcons();
    }

    function updateFileProgress(id, percentage, isOutgoing, downloadUrl = null, fileName = '') {
      const cardElement = document.getElementById(id);
      if (!cardElement) return;
      
      const progressBar = cardElement.querySelector('.progress-bar');
      progressBar.style.width = percentage + '%';

      if (percentage === 100) {
        progressBar.classList.remove('bg-blue-600');
        progressBar.classList.add('bg-emerald-500');

        if (!isOutgoing && downloadUrl) {
          const actionArea = cardElement.querySelector('.action-area');
          
          const downloadBtn = document.createElement('a');
          downloadBtn.href = downloadUrl;
          downloadBtn.download = fileName;
          downloadBtn.className = 'text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg flex items-center gap-1 font-medium transition';
          downloadBtn.innerHTML = `<i data-lucide="download" class="w-3.5 h-3.5"></i> حفظ`;
          
          actionArea.appendChild(downloadBtn);
          lucide.createIcons();
        }
      }
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function copyRoomLink() {
      const linkText = document.getElementById('peer-id-text').innerText;
      navigator.clipboard.writeText(linkText);
      alert("تم النسخ");
    }

    window.onload = initializePeer;
  </script>
</body>
</html>
